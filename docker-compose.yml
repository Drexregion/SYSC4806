services:
  kafka:
    image: apache/kafka:4.1.1
    container_name: mini-shopify-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  postgres:
    image: postgres:17
    container_name: mini-shopify-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: minishopify
      POSTGRES_USER: minishopify
      POSTGRES_PASSWORD: minishopify
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minishopify -d minishopify"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

# Start the app with the kafka and postgres profiles to use these services.
# The README has the full command. Without the profiles the app runs on
# in-memory H2 with no messaging, and none of this needs to be running.
