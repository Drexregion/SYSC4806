spring.application.name=mini-shopify

# In-memory H2 for now. Hibernate creates the schema at startup from the
# @Entity classes, so the data resets on every restart.
spring.datasource.url=jdbc:h2:mem:minishopify
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Prints the SQL Hibernate generates. Useful when documenting the schema
# for the README, and when checking what the ORM does behind the scenes.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Browse the generated schema at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Spring Data REST publishes the repositories under /api, so the JSON
# endpoints never collide with the Thymeleaf pages.
spring.data.rest.base-path=/api

# Track sessions by cookie only. Without this, the first redirect after a form
# post puts ;jsessionid=... in  the URL, where it shows in the address bar and leaks when a link is shared.
server.servlet.session.tracking-modes=cookie

# Azure App Service tells the app which port to listen on through PORT.
# Falls back to 8080 when running locally.
server.port=${PORT:8080}

# --- Kafka -------------------------------------------------------------
# The messaging beans only exist under the "kafka" profile, so none of this
# is read unless that profile is active. Run the broker with
# `docker compose up -d` and start the app with
# `--spring.profiles.active=kafka` to see the event flow end to end.
#
# Azure App Service has no broker, so the deployed app runs without the
# profile: shop creation still works, it just publishes no event.
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.kafka.consumer.group-id=mini-shopify-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=ca.carletonu.events
