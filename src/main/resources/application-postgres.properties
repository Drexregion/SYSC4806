# Active on Azure only, switched on with SPRING_PROFILES_ACTIVE=postgres.
# Overrides the H2 defaults in application.properties. Local development is
# untouched: without this profile the app still starts on in-memory H2 with
# nothing to install.
#
# Every value below comes from the environment. No connection detail, and no
# password, is committed to the repository. The app fails fast on startup if
# one of them is missing, which is what we want on a deploy.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# update, not create-drop. This is the point of the ticket: the schema is
# created once and then left alone, so data survives a restart and a redeploy
# instead of being wiped on every boot.
spring.jpa.hibernate.ddl-auto=update

# The H2 console has nothing to connect to here, and should not be exposed on
# a public URL in any case.
spring.h2.console.enabled=false

# Deployed logs do not need every statement Hibernate generates.
spring.jpa.show-sql=false
