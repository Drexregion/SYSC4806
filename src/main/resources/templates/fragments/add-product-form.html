<!--/* Add-product form. Include it on the shop page with:
     <div th:replace="~{fragments/add-product-form :: addProductForm(${shop})}"></div>
     productError and productForm are flash attributes set when a submit is rejected. */-->
<section class="add-product" th:fragment="addProductForm(shop)">
    <h2>Add a product</h2>
    <p class="form-error" th:if="${productError}" th:text="${productError}"></p>
    <form class="product-form" th:action="@{/shops/{id}/products(id=${shop.id})}" method="post">
        <label class="field field-wide">Name
            <input name="name" required th:value="${productForm?.name}">
        </label>
        <label class="field field-wide">Description
            <textarea name="description" rows="3" th:text="${productForm?.description}"></textarea>
        </label>
        <label class="field">Price ($)
            <input name="price" type="number" step="0.01" min="0" required th:value="${productForm?.price}">
        </label>
        <label class="field">Inventory
            <input name="quantity" type="number" min="0" required th:value="${productForm?.quantity}">
        </label>
        <label class="field">Type
            <input name="productType" placeholder="e.g. Clothing" th:value="${productForm?.productType}">
        </label>
        <div class="field-wide">
            <button class="button" type="submit">Add product</button>
        </div>
    </form>
</section>
