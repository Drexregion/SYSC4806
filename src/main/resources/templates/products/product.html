<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${product.name} - Mini-Shopify|">Product - Mini-Shopify</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a class="brand" th:href="@{/}">Mini-Shopify</a>
        <nav class="site-nav">
            <a th:href="@{/}">Home</a>
            <a th:href="@{/#featured}">Featured shops</a>
        </nav>
    </div>
</header>

<main class="container">
    <p class="back-link" th:if="${shop}">
        <a th:href="@{/shops/{id}(id=${shop.id})}" th:text="|← Back to ${shop.name}|">← Back to shop</a>
    </p>

    <div class="product-detail">
        <section class="product-info">
            <p class="tag" th:if="${product instanceof T(ca.carletonu.models.Item) and product.productType != null}"
               th:text="${product.productType}">Type</p>
            <p class="tag" th:if="${product instanceof T(ca.carletonu.models.Service)}">Service</p>
            <h1 th:text="${product.name}">Product name</h1>
            <p class="price" th:if="${product.price}"
               th:text="|$${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}|">$0.00</p>

            <th:block th:if="${product instanceof T(ca.carletonu.models.Item)}">
                <p class="stock" th:if="${product.quantity > 0}" th:text="|${product.quantity} in stock|">0 in stock</p>
                <p class="stock out" th:unless="${product.quantity > 0}">Out of stock</p>
            </th:block>
            <p class="muted" th:if="${product instanceof T(ca.carletonu.models.Service)}"
               th:text="|${product.duration} min service|">0 min service</p>

            <h2>Description</h2>
            <p th:if="${product.description}" th:text="${product.description}">Description</p>
            <p class="muted" th:unless="${product.description}">No description provided.</p>
        </section>

        <aside class="shop-summary" th:if="${shop}">
            <h2>Sold by</h2>
            <h3><a th:href="@{/shops/{id}(id=${shop.id})}" th:text="${shop.name}">Shop name</a></h3>
            <p class="tag" th:if="${shop.type}" th:text="${shop.type}">Category</p>
            <p class="muted" th:text="${shop.description}">Shop description</p>
            <p class="muted" th:if="${shop.seller}" th:text="|Run by ${shop.seller.name}|">Run by seller</p>
            <a th:href="@{/shops/{id}(id=${shop.id})}">Visit shop</a>
        </aside>
    </div>
</main>

<footer class="site-footer">
    <div class="container">SYSC 4806 term project, Carleton University</div>
</footer>
</body>
</html>
