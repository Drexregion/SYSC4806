<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>All shops - Mini-Shopify</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a class="brand" th:href="@{/}">Mini-Shopify</a>
        <nav class="site-nav">
            <a th:href="@{/}">Home</a>
            <a th:href="@{/shops}">All shops</a>
        </nav>
    </div>
</header>

<main>
    <section class="hero">
        <div class="container">
            <h1>All shops</h1>
            <p class="lead">Browse every shop on Mini-Shopify, or search by name or category.</p>
            <div th:replace="~{fragments/search-form :: searchForm}"></div>
        </div>
    </section>

    <section class="container">
        <p class="muted" th:text="${#lists.size(shops)} == 1 ? '1 shop' : ${#lists.size(shops)} + ' shops'">0 shops</p>

        <p class="empty" th:if="${#lists.isEmpty(shops)}">
            No shops yet. Check back soon.
        </p>

        <ul class="shop-grid" th:unless="${#lists.isEmpty(shops)}">
            <li class="shop-card" th:each="shop : ${shops}">
                <h3><a th:href="@{/shops/{id}(id=${shop.id})}" th:text="${shop.name}">Shop name</a></h3>
                <p class="tag" th:if="${shop.type}" th:text="${shop.type}">Category</p>
                <p th:text="${shop.description}">Description</p>
                <p class="muted" th:text="${#lists.size(shop.products)} == 1 ? '1 product' : ${#lists.size(shop.products)} + ' products'">0 products</p>
            </li>
        </ul>
    </section>
</main>

<footer class="site-footer">
    <div class="container">SYSC 4806 term project, Carleton University</div>
</footer>
</body>
</html>
